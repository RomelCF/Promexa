version: '3.8'

services:
  # -------------------------------------------------------------------------
  # PostgreSQL: Transacciones, usuarios, publicaciones, productos, mensajes
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: promexa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-promexa_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - promexa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Neo4j: Grafo de relaciones (usuarios, publicaciones, productos, afinidad)
  # -------------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: promexa_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_secure_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474" # Browser Web UI
      - "${NEO4J_PORT:-7687}:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - promexa-network

  # -------------------------------------------------------------------------
  # Redis: Broker WebSockets, colas livianas y caché distribuido
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: promexa_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_secure_password}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - promexa-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

